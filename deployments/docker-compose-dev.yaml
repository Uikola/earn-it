services:
  database:
    container_name: database
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=earnit
    image: postgres:18-alpine3.23
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d keepflame -p 5432" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - database:/var/lib/postgresql
    restart: always
  redis:
    container_name: redis
    image: "redis:latest"
    command: redis-server --requirepass password
    ports:
      - "6379:6379"
    restart: always

volumes:
  database: