services:
  
  bot:
    container_name: bot
    image: ghcr.io/uikola/earn-it:latest
    env_file:
      - ../.env
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  database:
    container_name: database
    ports:
      - "5433:5432"
    env_file:
      - ../.env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    image: postgres:18-alpine3.23
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p 5432" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - database:/var/lib/postgresql
    restart: always
  redis:
    container_name: redis
    image: "redis:latest"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - ../.env
    restart: always

volumes:
  database: