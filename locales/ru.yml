main_menu_text: Добро пожаловать! Желаю скорейшего выполнения целей
unauthorized: Вы не авторизованы! Пропишите /start

input_timezone: |-
  Введите часовой пояс (например, Europe/Moscow)
invalid_timezone: |-
  Некорректный часовой пояс. Попробуйте снова
input_reward_weekly_bonus: |-
  Введите еженедельный бонус (положительное число)
invalid_reward_weekly_bonus: |-
  Бонус должен быть положительным числом

habits_menu_text: |-
  🏋️ Ваши привычки:
  
  {{ if .Habits }}{{ range .Habits }}───────────────────────{{"\n"}}<b>{{ .Name }}</b>{{"\n"}}▸ Прогресс за неделю: {{ .ProgressBar }} {{ .WeeklyGoalDone }}/{{ .WeeklyGoal }}{{ if .WeeklyGoalCompleted }} ✅{{ else }} ❌{{ end }}{{"\n"}}▸ +{{ .RewardPerExecute }} 🪙 за выполнение{{"\n"}}───────────────────────{{"\n"}}{{ end }}За успешную неделю +{{ .RewardWeeklyBonus }} 🪙{{ else }}<i>- Отсутствуют</i>{{ end }}
input_habit_name: |-
  Введите название привычки
invalid_habit_name: |-
  Название привычки не должно быть пустым
input_habit_weekly_goal: |-
  Введите цель выполнения привычки на неделю
invalid_habit_weekly_goal: |-
  Цель на неделю должна быть положительным числом
input_habit_reward_per_execute: |-
  Введите награду за выполение привычки
invalid_habit_reward_per_execute: |-
  Награда за выполнение должна быть положительным числом
habit_created:
  Новая привычка создана! Вперёд к победе

habit_complete_text: |-
  Вперёд к победе
habit_delete_text: |-
  Корректировка под свои особенности - прямой путь к победе

weekly_bonus_notification: |-
  🎉 Поздравляем! Вы выполнили все цели по привычкам за прошлую неделю и получили бонус +{{ .Amount }} 🪙

tasks_menu_today: |-
  📋 Задачи на сегодня ({{ .Count }} шт.):
  
  {{ range .Tasks }}───────────────────────{{"\n"}}<b>{{ .Number }}. {{ .Title }}</b>{{"\n"}}▸ 🗓️ {{ .ScheduledDate }} | {{ .RewardValue }} 🪙{{"\n"}}───────────────────────{{"\n"}}{{ end }}
tasks_menu_tomorrow: |-
  📋 Задачи на завтра ({{ .Count }} шт.):
  
  {{ range .Tasks }}───────────────────────{{"\n"}}<b>{{ .Number }}. {{ .Title }}</b>{{"\n"}}▸ 🗓️ {{ .ScheduledDate }} | {{ .RewardValue }} 🪙{{"\n"}}───────────────────────{{"\n"}}{{ end }}
tasks_menu_later: |-
  📋 Задачи ({{ .Count }} шт.):
  
  {{ range .Tasks }}───────────────────────{{"\n"}}<b>{{ .Number }}. {{ .Title }}</b>{{"\n"}}▸ 🗓️ {{ .ScheduledDate }} | {{ .RewardValue }} 🪙{{"\n"}}───────────────────────{{"\n"}}{{ end }}
tasks_empty: |-
  📋 Нет задач
input_task_title: |-
  Введите текст задачи
invalid_task_title: |-
  Текст задачи не должен быть пустым
input_task_date: |-
  Введите дату выполнения в формате ГГГГ-ММ-ДД
invalid_task_date: |-
  Некорректная дата. Формат: ГГГГ-ММ-ДД
input_task_reward: |-
  Укажите ценность в монетах (по умолчанию 10)
invalid_task_reward: |-
  Ценность должна быть положительным числом
task_created: |-
  ✅ Задача создана!
task_complete_text: |-
  Выберите задачу для выполнения
task_delete_text: |-
  Выберите задачу для удаления

wallet_menu_text: |-
  💰 Ваш баланс: {{ .Balance }} 🪙
  
  Всего заработано: {{ .TotalIncome }} 🪙
  Всего потрачено: {{ .TotalExpense }} 🪙
  {{ if .Transactions }}
  📜 Последние транзакции:
  {{ range .Transactions }}{{ .FormattedAmount }} 🪙 — {{ .SourceName }} ({{ .FormattedDate }})
  {{ end }}{{ else }}
  Нет транзакций{{ end }}
