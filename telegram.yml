settings:
  parse_mode: html
  token_env: BOT_TOKEN
  long_poller:
    Timeout: 10

commands:
  /start: Перезапустить бота

buttons:
  core:hide:
    unique: coreHide
    text: '{{ text `hide` }}'

  core:cancel:
    unique: coreCancel
    text: '{{ text `cancel` }}'

  core:back:
    unique: coreBack
    text: '{{ text `back` }}'

  core:pageCounter:
    unique: corePageCounter
    text: '📃 {{.Page}}/{{.PagesCount}}'

  mainMenuBack:
    unique: mainMenuBack
    text: '{{ text `back` }}'

  tasksMenu:
    unique: tasksMenu
    text: '📋 Задачи'
  tasksMenuBack:
    unique: tasksMenuBack
    text: '{{ text `back` }}'
  tasks:today:
    unique: tasksToday
    text: '📋 Сегодня'
  tasks:tomorrow:
    unique: tasksTomorrow
    text: '📅 На завтра'
  tasks:later:
    unique: tasksLater
    text: '📆 Позже'
  tasks:new:
    unique: newTask
    text: '➕ Новая задача'
  tasks:complete:
    unique: completeTask
    text: '✅ Выполнить задачу'
  tasks:complete:task:
    unique: taskToComplete
    callback_data: '{{ .ID }}'
    text: '{{ .Title }}'

  shopMenu:
    unique: shopMenu
    text: '🛒 Магазин'

  statsMenu:
    unique: statsMenu
    text: '📊 Статистика'

  habitsMenu:
    unique: habitsMenu
    text: '🏆 Привычки'
  habitsMenuBack:
    unique: habitsMenuBack
    text: '{{ text `back` }}'
  habits:new:
    unique: newHabit
    text: '➕ Новая привычка'
  habits:complete:
    unique: completeHabit
    text: '☑️ Выполнить'
  habits:complete:habit:
    unique: habitToComplete
    callback_data: '{{ .ID }}'
    text: '{{ .Name }} {{ .WeeklyGoalDone }}/{{ .WeeklyGoal }}{{ if .WeeklyGoalCompleted }} ✅{{ else }} ❌{{ end }}'
  habits:delete:
    unique: deleteHabit
    text: '🗑 Удалить'
  habits:delete:habit:
    unique: habitToDelete
    callback_data: '{{ .ID }}'
    text: '{{ .Name }}'

  walletMenu:
    unique: walletMenu
    text: '💰 Кошёлек'

  settingsMenu:
    unique: settingsMenu
    text: '⚙️ Настройки'

markups:
  core:hide:
    - [ core:hide ]

  mainMenu:
    - [ tasksMenu, habitsMenu ]
    - [ shopMenu, walletMenu ]
    - [ statsMenu, settingsMenu ]
  mainMenuBack:
    - [ mainMenuBack ]

  habitsMenu:
    - [ habits:new ]
    - [ habits:complete ]
    - [ habits:delete ]
    - [ mainMenuBack ]
  habitsMenuBack:
    - [ habitsMenuBack ]

  tasksMenuToday:
    - [ tasks:complete ]
    - [ tasks:new ]
    - [ tasks:tomorrow, tasks:later ]
    - [ mainMenuBack ]
  tasksMenuTomorrow:
    - [ tasks:complete ]
    - [ tasks:new ]
    - [ tasks:today, tasks:later ]
    - [ mainMenuBack ]
  tasksMenuLater:
    - [ tasks:complete ]
    - [ tasks:new ]
    - [ tasks:today, tasks:tomorrow ]
    - [ mainMenuBack ]
  tasksMenuBack:
    - [ tasksMenuBack ]
